<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>掃描報到</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #000; }
  /* 上 3/4：相機一直開著 */
  #cam { position: fixed; top: 0; left: 0; right: 0; height: 75vh; height: 75dvh; background: #111; overflow: hidden; }
  #cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #cam .frame { position: absolute; left: 50%; top: 50%; width: 62vmin; height: 62vmin; transform: translate(-50%, -50%); border: 4px solid rgba(255, 255, 255, .85); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .25); }
  #cam .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ddd; font-size: 18px; text-align: center; padding: 24px; }
  /* 下 1/4：結果 */
  #panel { position: fixed; left: 0; right: 0; bottom: 0; height: 25vh; height: 25dvh; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; background: #6b3a86; transition: background .15s; }
  #panel.ready { background: #6b3a86; }
  #panel.wait { background: #555; }
  #panel.welcome { background: #1f9d55; }
  #panel.manual { background: #d63031; }
  #big { font-size: 34px; font-weight: 900; line-height: 1.15; }
  #line2 { font-size: 18px; margin-top: 6px; line-height: 1.35; }
  #line3 { font-size: 15px; margin-top: 4px; opacity: .9; line-height: 1.3; }
  #line2:empty, #line3:empty { display: none; }
  #startBtn { margin-top: 8px; font-size: 22px; font-weight: bold; padding: 14px 28px; border: 3px solid #fff; border-radius: 14px; background: transparent; color: #fff; }
  /* hidden 一律隱藏（.hint 有 display:flex 會蓋掉 hidden，相機開了說明文字還留在畫面上） */
  [hidden] { display: none !important; }
  #startBtn:disabled { opacity: .4; }
</style>
</head>
<body>
<div id="cam">
  <video id="video" playsinline muted></video>
  <div class="frame" id="frame" hidden></div>
  <div class="hint" id="hint">🌸 會員掃描報到<br><br>載入中…</div>
</div>
<div id="panel" class="ready">
  <div id="big">會員掃描報到</div>
  <div id="line2">載入中…</div>
  <div id="line3"></div>
  <button id="startBtn" disabled>📷 開始掃描</button>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// 設定：LIFF ID 與 GAS 網址
const LIFF_ID = '2012266558-10cmX0Pz';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxMiGQCBah3hom3J7u0Do51BG-7dMpe0ZKSjb1sriWF-htasK_mkT94nYoU2B8OLeQP/exec';

const $ = (id) => document.getElementById(id);

// 下方結果區：kind＝ready／wait／welcome／manual
function panel(kind, big, line2, line3) {
  $('panel').className = kind;
  $('big').textContent = big || '';
  $('line2').textContent = line2 || '';
  $('line3').textContent = line3 || '';
}

function env() {
  let os = '', line = '', liffVer = '';
  try { os = liff.getOS(); line = liff.getLineVersion(); liffVer = liff.getVersion(); } catch (e) {}
  return { liff: liffVer, os: os, line: line, ua: navigator.userAgent };
}

function newRid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 呼叫 GAS；網路失敗同一個 rid 自動重試 1 次（GAS 用 rid 去重，不會重複報到）
async function call(type, data, rid) {
  const body = Object.assign({ type: type, rid: rid || newRid(), idToken: liff.getIDToken(), env: env() }, data || {});
  for (let i = 0; i < 2; i++) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    try {
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
      clearTimeout(timer);
      return await res.json();
    } catch (err) {
      clearTimeout(timer);
      if (i === 1) throw err;
    }
  }
}

// 前端錯誤回報後端（LINE 內建瀏覽器看不到 console）
function report(msg) {
  try {
    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'client_log', rid: newRid(), idToken: liff.getIDToken(), env: env(), msg: String(msg).slice(0, 1000) }) });
  } catch (e) {}
}
window.addEventListener('error', (e) => report('程式錯誤：' + e.message + ' @' + e.filename + ':' + e.lineno));

function buzz(ok) {
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 100, 200]);
}

// 掃到 QR → 問 GAS → 下方顯示結果（相機照開，結果出來就能掃下一位）
async function checkin(value) {
  const rid = newRid();
  panel('wait', '查詢中…', '', '');
  try {
    const out = await call('checkin', { code: value }, rid);
    if (out.ok) {
      const m = out.member;
      const who = m ? [m.id, m.t, m.c].filter(Boolean).join('｜') : '';
      if (out.result === 'busy') {
        // 太多人同時掃 → 請再掃一次；清掉「剛掃過」記號，同一張可以馬上重掃
        panel('wait', '⏳ 忙碌中', '請再掃一次', '');
        lastCode = '';
      } else if (out.result === 'welcome') {
        panel('welcome', '✅ 歡迎　' + (m ? m.n : ''), who, '');
        buzz(true);
      } else {
        // 格式（使用者 2026-10-29 指定）：原因／姓名｜編號｜類別；有會員資料就不顯示代碼（代碼仍記在報到紀錄）
        panel('manual', '❌ 專人協助', out.reason, m ? [m.n, m.id, m.t].join('｜') : '代碼 ' + rid);
        buzz(false);
      }
    } else if (out.error === 'token') {
      liff.logout(); liff.login(); // 登入過期 → 重新登入
      return;
    } else if (out.error === 'not_staff') {
      panel('manual', '❌ 專人協助', '您不在現場人員名單，無法掃描', '代碼 ' + rid);
      buzz(false);
    } else {
      panel('manual', '❌ 專人協助', '系統錯誤，請再掃一次', '代碼 ' + rid);
      buzz(false);
    }
  } catch (err) {
    report('報到請求失敗：' + err);
    panel('manual', '❌ 專人協助', '網路連線失敗，請再掃一次', '代碼 ' + rid);
    buzz(false);
  }
  if (useLine) { $('startBtn').textContent = '📷 掃描下一位'; $('startBtn').hidden = false; }
  else busy = false; // 繼續偵測下一張
}

// ---------- 相機：只開一次，一直開著持續偵測（不用按「繼續掃描」，也不會每次問權限） ----------
const video = $('video');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let busy = false;     // 正在問 GAS 時先不偵測
let lastCode = '';
let lastSeen = 0;     // 同一張 QR 還在鏡頭前就不重複送；移開 3 秒後再出現才算新的一次
const SAME_GAP = 3000;

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
  video.srcObject = stream;
  await video.play();
  $('hint').hidden = true;
  $('frame').hidden = false;
  $('startBtn').hidden = true;
  panel('ready', '', '', ''); // 相機開了就只留對準框，不放說明文字（使用者 2026-10-29 指定）
  tick();
}

function tick() {
  if (!busy && video.readyState >= 2 && video.videoWidth) {
    const w = 480;
    const h = Math.round(video.videoHeight * w / video.videoWidth);
    canvas.width = w; canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    const qr = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
    if (qr && qr.data) {
      const now = Date.now();
      const same = qr.data === lastCode && now - lastSeen < SAME_GAP;
      lastCode = qr.data;
      lastSeen = now;
      if (!same) {
        busy = true;
        checkin(qr.data);
      }
    }
  }
  setTimeout(tick, 120);
}

// 相機開不了（舊手機、拒絕權限）→ 改用 LINE 內建掃描器（每次要按按鈕）
let useLine = false;
async function scanWithLine() {
  try {
    const r = await liff.scanCodeV2();
    if (r && r.value) { $('startBtn').hidden = true; checkin(r.value); }
  } catch (err) {
    report('scanCodeV2 失敗：' + err);
    panel('manual', '無法開啟相機', String(err.message || err), '');
  }
}

$('startBtn').onclick = async () => {
  if (useLine) return scanWithLine();
  try {
    await startCamera();
  } catch (err) {
    report('getUserMedia 失敗：' + (err.name || '') + ' ' + (err.message || err));
    useLine = true;
    $('hint').textContent = err && err.name === 'NotAllowedError' ? '相機權限被拒絕，改用 LINE 掃描器' : '改用 LINE 掃描器';
    $('startBtn').textContent = '📷 掃描會員條碼';
    scanWithLine();
  }
};

// 頁面開著時每 4 分鐘叫醒 GAS 一次（保持暖機、名冊快取不過期 → 掃描比較快）
setInterval(() => {
  if (document.visibilityState === 'visible') fetch(GAS_URL, { method: 'POST', body: '{"type":"ping"}' }).catch(() => {});
}, 240000);

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (err) {
    panel('manual', '載入失敗', '請關掉重開', String(err.message || err));
    report('liff.init 失敗：' + err);
    return;
  }
  if (!liff.isLoggedIn()) { liff.login(); return; }
  if (!liff.isInClient()) { panel('manual', '請在手機 LINE 裡開啟', '', ''); return; }
  panel('ready', '會員掃描報到', '確認身分中…', '');
  try {
    const out = await call('staff_check');
    if (out.error === 'token') { liff.logout(); liff.login(); return; }
    if (!out.staff) { panel('manual', '無法使用', '您不在現場人員名單，請洽管理者開通', ''); return; }
  } catch (err) {
    report('身分確認失敗：' + err);
    panel('manual', '網路連線失敗', '請關掉重開', '');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof jsQR !== 'function') {
    useLine = true;
    $('startBtn').textContent = '📷 掃描會員條碼';
  }
  $('hint').innerHTML = '🌸 會員掃描報到<br><br>按下方按鈕開啟相機';
  panel('ready', '準備好了', '', '');
  $('startBtn').disabled = false;
})();
</script>
</body>
</html>
